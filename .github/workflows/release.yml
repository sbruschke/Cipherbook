name: release

# Every push to main that touches shipping code publishes a new build: the
# marketing version comes from project.yml, the build number from this
# workflow's run number, so the LiveContainer feed can never fall behind main.
on:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'Core/**'
      - 'Keyboard/**'
      - 'Entitlements/**'
      - 'Resources/**'
      - 'project.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (default: MARKETING_VERSION in project.yml)'
        required: false

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          # project.yml is the single source of truth for the marketing version.
          [[ -n "$VERSION" ]] || VERSION="$(./scripts/version.sh)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "error: bad version '$VERSION'" >&2; exit 1; }
          BODY=$(git log -1 --format='%s')
          # Monotonic across releases, which is what makes LiveContainer offer
          # the update even when the marketing version has not moved.
          BUILD="${{ github.run_number }}"
          DESC_FILE="$RUNNER_TEMP/release-description.txt"
          printf '%s' "$BODY" > "$DESC_FILE"
          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "ipa_name=Cipherbook-${VERSION}-build${BUILD}.ipa"
            echo "description_file=$DESC_FILE"
          } >> "$GITHUB_OUTPUT"

      - name: Select latest Xcode
        run: |
          LATEST_XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned .app
        run: |
          xcodegen generate
          xcodebuild \
            -project Cipherbook.xcodeproj \
            -scheme Cipherbook \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ steps.meta.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.meta.outputs.build }}" \
            -IDEPackageSupportUseBuiltinSCM=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Embed entitlements
        run: |
          set -euo pipefail
          # SideStore takes App Groups from the code signature when it re-signs;
          # without them the keyboard can't read fonts from the shared container.
          APP=build/Build/Products/Release-iphoneos/Cipherbook.app
          codesign -f -s - --entitlements Entitlements/CipherKeys.entitlements "$APP/PlugIns/CipherKeys.appex"
          codesign -f -s - --entitlements Entitlements/Cipherbook.entitlements "$APP"
          codesign -d --entitlements - "$APP/PlugIns/CipherKeys.appex"
          codesign -d --entitlements - "$APP"

      - name: Package .ipa
        id: package
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/Cipherbook.app build/Payload/
          (cd build && zip -qr "${{ steps.meta.outputs.ipa_name }}" Payload)
          echo "ipa_path=build/${{ steps.meta.outputs.ipa_name }}" >> "$GITHUB_OUTPUT"

      - name: Tag release
        id: commit
        run: |
          set -euo pipefail
          git config user.name "Cipherbook CI"
          git config user.email "ci@users.noreply.github.com"
          TAG="v${{ steps.meta.outputs.version }}-build${{ steps.meta.outputs.build }}"
          git tag -a "$TAG" -m "Cipherbook $TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release (ipa.dxshdw.dev hub)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.commit.outputs.tag }}
          IPA_PATH: ${{ steps.package.outputs.ipa_path }}
          DESCRIPTION_FILE: ${{ steps.meta.outputs.description_file }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$IPA_PATH" \
            --repo "${{ github.repository }}" \
            --title "Cipherbook $TAG" \
            --notes-file "$DESCRIPTION_FILE" \
            --verify-tag

      - name: Summary
        run: |
          {
            echo "### Cipherbook v${{ steps.meta.outputs.version }} (build ${{ steps.meta.outputs.build }})"
            echo ""
            echo "LiveContainer source URL:"
            echo '`https://ipa.dxshdw.dev/source.json`'
          } >> "$GITHUB_STEP_SUMMARY"
