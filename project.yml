name: Cipherbook

options:
  bundleIdPrefix: dev.dxshdw
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
  KeyboardCore:
    path: Packages/KeyboardCore

targets:
  Cipherbook:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
      - path: Core
      - path: Resources
    dependencies:
      - package: ZIPFoundation
      - target: CipherKeys
    # Merged with the generated Info.plist; only what build settings can't express.
    info:
      path: Config/Cipherbook-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: dev.dxshdw.cipherbook
            CFBundleURLSchemes: [cipherbook]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dxshdw.cipherbook
        PRODUCT_NAME: Cipherbook
        MARKETING_VERSION: "1.9.0"
        CURRENT_PROJECT_VERSION: "0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cipherbook
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  # Custom keyboard: English QWERTY whose keys are drawn in a Cipherbook font.
  # Entitlements (the shared App Group) are embedded by CI with an ad-hoc
  # signature, since SideStore reads them from the binary when it re-signs.
  CipherKeys:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Keyboard
        excludes:
          - "Info.plist"
          - "Resources"
          - "Resources/**"
      - path: Keyboard/Resources
        buildPhase: resources
      - path: Core/SharedKeyboard.swift
    dependencies:
      - package: KeyboardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dxshdw.cipherbook.keyboard
        PRODUCT_NAME: CipherKeys
        MARKETING_VERSION: "1.9.0"
        CURRENT_PROJECT_VERSION: "0"
        INFOPLIST_FILE: Keyboard/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
